name: Feature request
description: Propose new functionality or an improvement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard, slow or impossible today? Describe the pain, not the solution.
      placeholder: Cashiers have to re-key supplier details on every purchase order.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What you would build, at a level a reviewer can argue with.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you weighed, and why you set them aside. "None" is a valid answer.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How we will know this is done. One checkbox per observable behaviour.
      value: |
        - [ ]
        - [ ]
        - [ ]
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Rough size
      options:
        - XS — under a day
        - S — a few days
        - M — about a week
        - L — multiple weeks
        - Unknown
      default: 4
    validations:
      required: true

  - type: textarea
    id: risk
    attributes:
      label: Risks and impact
      description: Breaking changes, migrations, performance, security, or cost implications.
    validations:
      required: false

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and discussions for the same idea.
          required: true
